service: laravel-api-budget

provider:
  name: aws
  region: us-east-1
  runtime: provided.al2
  stage: production
  memorySize: 1024
  environment:
    APP_URL: https://api.mrqn-labs.com
    APP_ENV: local
    APP_DEBUG: true
    APP_KEY: ${ssm:/app-budget/APP_KEY}

    # Base de datos
    DB_CONNECTION: mysql
    DB_HOST: ${ssm:/app-budget/DB_HOST}
    DB_PORT: 4000
    DB_DATABASE: db_expense_control
    DB_USERNAME: ${ssm:/app-budget/DB_USERNAME}
    DB_PASSWORD: ${ssm:/app-budget/DB_PASSWORD}

    # Queue
    QUEUE_CONNECTION: sqs
    SQS_QUEUE: ${construct:jobs.queueUrl}
    SQS_PREFIX: ''

    LOG_CHANNEL: stderr
    SESSION_DRIVER: cookie
    CACHE_DRIVER: array
    SESSION_DOMAIN: .mrqn-labs.com
    FRONTEND_URL: https://mrqn-labs.com
    SANCTUM_STATEFUL_DOMAINS: mrqn-labs.com,api.mrqn-labs.com
    MYSQL_ATTR_SSL_CA: /etc/pki/tls/certs/ca-bundle.crt
    GEMINI_API_KEY: ${ssm:/app-budget/API_KEY_GEMINI}

plugins:
  - ./vendor/bref/bref
  - serverless-domain-manager
  - serverless-lift

custom:
  customDomain:
    domainName: api.mrqn-labs.com
    basePath: ''
    stage: ${self:provider.stage}
    createRoute53Record: true
    apiType: http
    certificateName: mrqn-labs.com
    endpointType: regional

functions:
  api:
    handler: public/index.php
    description: 'Laravel API Budget'
    timeout: 28
    layers:
      # Si prefieres ARN explícito directo: arn:aws:lambda:us-east-1:534081306603:layer:php-83-fpm:65
      - ${bref:layer.php-83-fpm}
    events:
      - httpApi: '*'

  artisan:
    handler: artisan
    description: 'Ejecutor de comandos de consola Artisan'
    timeout: 120
    layers:
      # Si prefieres ARN explícito directo: arn:aws:lambda:us-east-1:534081306603:layer:php-83:65
      - ${bref:layer.php-83}

constructs:
  jobs:
    type: queue
    worker:
      handler: Bref\LaravelBridge\Queue\QueueHandler
      runtime: php-83
      timeout: 60

package:
  exclude:
    - node_modules/**
    - public/storage
    - resources/assets/**
    - storage/**
    - tests/**
    - .env
